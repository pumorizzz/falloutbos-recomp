; fobos.ini -- settings fobos.exe reads at start when it sits beside it (or in
; the folder with game\). NAME=VALUE, one a line; a line starting with ';' is a
; comment. A variable already set in the environment wins: in Steam, Properties
; -> Launch Options, e.g.  RECOMP_GPU_RASTER_SCALE=2 %command%
; Written by tools/package.ps1 for the Steam Deck (1280x800, 16:10).
RECOMP_PB_EXEC=1
RECOMP_FB_WINDOW=1
RECOMP_KEYBOARD=1
RECOMP_GPU_RASTER=1
RECOMP_FB_FULLSCREEN=1
RECOMP_FB_SIZE=1280x800
FBOS_ASPECT=16:10
RECOMP_GPU_RASTER_SCALE=1
RECOMP_GPU_RASTER_MSAA=2
RECOMP_GPU_RASTER_SSAA=1
RECOMP_FPS_LIMIT=60
RECOMP_FRAME_SKIP=auto
log=fobos.log
